<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="kvl-grad-st" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="kvl-glow-st" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagonal ring -->
  <polygon points="200,30 350,115 350,285 200,370 50,285 50,115"
           fill="none" stroke="url(#kvl-grad-st)" stroke-width="3" opacity="0.4"/>

  <!-- Inner hexagonal ring -->
  <polygon points="200,60 320,130 320,270 200,340 80,270 80,130"
           fill="none" stroke="url(#kvl-grad-st)" stroke-width="2" opacity="0.7"/>

  <!-- K•V•L centered -->
  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="900" filter="url(#kvl-glow-st)" text-anchor="middle">
    <text x="200" y="225" font-size="100" fill="url(#kvl-grad-st)" letter-spacing="8">
      K<tspan fill="#3b82f6" font-size="40" baseline-shift="20%">·</tspan>V<tspan fill="#3b82f6" font-size="40" baseline-shift="20%">·</tspan>L
    </text>
  </g>

  <!-- BUSINESS SOLUTIONS subtext -->
  <text x="200" y="265" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700"
        letter-spacing="6" text-anchor="middle" fill="#64748b">
    BUSINESS SOLUTIONS
  </text>

  <!-- Tagline -->
  <text x="200" y="295" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500"
        letter-spacing="3" text-anchor="middle" fill="#94a3b8">
    NEXT-GEN INDIA
  </text>

  <!-- Accent dots -->
  <circle cx="200" cy="320" r="3" fill="#3b82f6"/>
  <circle cx="215" cy="320" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="230" cy="320" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="185" cy="320" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="170" cy="320" r="3" fill="#3b82f6" opacity="0.3"/>
</svg>
