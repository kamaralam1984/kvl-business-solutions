<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="kvl-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="kvl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- K•V•L letters with dots -->
  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="900" filter="url(#kvl-glow)">
    <text x="20" y="115" font-size="120" fill="url(#kvl-gradient)" letter-spacing="6">K</text>
    <circle cx="125" cy="80" r="7" fill="#3b82f6"/>
    <text x="145" y="115" font-size="120" fill="url(#kvl-gradient)" letter-spacing="6">V</text>
    <circle cx="250" cy="80" r="7" fill="#3b82f6"/>
    <text x="270" y="115" font-size="120" fill="url(#kvl-gradient)" letter-spacing="6">L</text>
  </g>

  <!-- BUSINESS SOLUTIONS subtext -->
  <text x="20" y="155" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="10" fill="#64748b">
    BUSINESS SOLUTIONS
  </text>

  <!-- Decorative accent line -->
  <rect x="20" y="170" width="60" height="3" fill="url(#kvl-gradient)" rx="1.5"/>
  <rect x="90" y="170" width="20" height="3" fill="#3b82f6" opacity="0.6" rx="1.5"/>
  <rect x="120" y="170" width="8" height="3" fill="#3b82f6" opacity="0.3" rx="1.5"/>
</svg>
